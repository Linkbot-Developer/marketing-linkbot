<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" font-family="Inter, Arial, Helvetica, sans-serif">
<title>How code gets to the server</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="300" fill="#FFFFFF"/>
<rect x="40" y="40" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="105" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#444441">Developer PC</text>
<text x="105" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">git push</text>
<rect x="195" y="40" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="260" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">GitHub</text>
<text x="260" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Private repo</text>
<rect x="350" y="40" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="415" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">GitHub Actions</text>
<text x="415" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Test and bundle</text>
<rect x="505" y="40" width="135" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="572.5" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Server</text>
<text x="572.5" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">PM2 + Caddy</text>
<line x1="172" y1="68" x2="193" y2="68" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="327" y1="68" x2="348" y2="68" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="482" y1="68" x2="503" y2="68" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="350" y="170" width="130" height="56" rx="8" fill="#E8EDF5" stroke="#12488B" stroke-width="1"/>
<text x="415" y="189" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#172B4D">.env secrets</text>
<text x="415" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#12488B">Server only</text>
<rect x="505" y="170" width="135" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="572.5" y="189" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">n8n W2</text>
<text x="572.5" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Starts it at 17:00 SGT</text>
<path d="M 415 168 L 415 125 L 540 125 L 540 98" fill="none" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="572" y1="168" x2="572" y2="98" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<text x="40" y="125" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">Every push to main deploys automatically.</text>
<text x="40" y="145" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">The server never builds; no Docker.</text>
<rect x="40" y="258" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="62" y="265" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">On the server</text><rect x="171" y="258" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="193" y="265" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">GitHub</text><rect x="253" y="258" width="14" height="14" rx="3" fill="#E8EDF5" stroke="#12488B"/><text x="275" y="265" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">Secrets (never in Git)</text><rect x="447" y="258" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/><text x="469" y="265" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">Your PC</text>
</svg>