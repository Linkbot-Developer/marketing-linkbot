<svg xmlns="http://www.w3.org/2000/svg" width="680" height="320" viewBox="0 0 680 320" font-family="Inter, Arial, Helvetica, sans-serif">
<title>Generation pipeline for one post</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#73726C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="320" fill="#FFFFFF"/>
<rect x="40" y="40" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="130" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Planned post</text>
<text x="130" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Lark Base row</text>
<rect x="250" y="40" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Copywriter</text>
<text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Gemini, JSON + render spec</text>
<rect x="460" y="40" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="550" y="59" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Checks</text>
<text x="550" y="78" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Banned words, brand rules</text>
<line x1="222" y1="68" x2="248" y2="68" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="432" y1="68" x2="458" y2="68" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="550" y1="98" x2="550" y2="168" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<rect x="460" y="170" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="550" y="189" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Render</text>
<text x="550" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Image, carousel, video</text>
<rect x="250" y="170" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="340" y="189" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Visual QC</text>
<text x="340" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">AI looks at the images</text>
<rect x="40" y="170" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="130" y="189" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#085041">Back to Lark</text>
<text x="130" y="208" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">pending_approval + W4 card</text>
<line x1="458" y1="198" x2="432" y2="198" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<line x1="248" y1="198" x2="222" y2="198" stroke="#73726C" stroke-width="1.2" marker-end="url(#a)"/>
<text x="340" y="262" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Any failed check is retried with feedback (up to 3 attempts); an AI outage leaves the post untouched.</text>
<rect x="40" y="286" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7"/><text x="62" y="293" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">Runner + renderer (server)</text><rect x="262" y="286" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="284" y="293" text-anchor="start" dominant-baseline="central" font-size="12" fill="#5F5E5A">Lark</text>
</svg>