<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
{{{theme}}}
:root { --w: {{width}}px; --h: {{height}}px; }
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.band { position: absolute; left: 0; right: 0; bottom: 0; height: 46%;
        background: linear-gradient(180deg, rgba(23,43,77,0) 0%, rgba(23,43,77,.86) 40%, var(--navy) 100%); }
.solid .band { display: none; }
.top { position: absolute; top: 80px; left: 80px; }
.text { position: absolute; left: 80px; right: 300px; bottom: 120px; display: flex; flex-direction: column; gap: 26px; }
.solid .text { right: 80px; bottom: auto; top: 50%; transform: translateY(-50%); }
h1 { color: var(--white); font-size: {{headlineSize}}px; }
p.sub { color: var(--ink-soft); font-size: 36px; }
</style></head>
<body><div class="frame {{variant}}">
  {{{background}}}
  <div class="band"></div>
  <div class="top">{{{tag}}}</div>
  <div class="text">
    <div class="accent"></div>
    <h1 data-fit="{{headlineMax}}">{{{headline}}}</h1>
    {{{sub}}}
  </div>
  <img class="logo" src="{{{logo}}}" alt="">
</div>
<script>{{{fit}}}</script>
</body></html>
