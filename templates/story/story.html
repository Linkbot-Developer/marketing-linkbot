<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
{{{theme}}}
:root { --w: 1080px; --h: 1920px; }
/* Safe zones: keep text out of the top 250px and bottom 340px (platform UI). */
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,43,77,.25) 0%, rgba(23,43,77,.1) 35%, rgba(23,43,77,.9) 68%, var(--navy) 100%); }
.top { position: absolute; top: 260px; left: 80px; }
.text { position: absolute; left: 80px; right: 80px; bottom: 420px; display: flex; flex-direction: column; gap: 30px; }
h1 { color: var(--white); font-size: 100px; }
p { color: var(--ink-soft); font-size: 42px; }
.pill { align-self: flex-start; background: var(--blue); color: var(--white); font-weight: 700; font-size: 40px; padding: 28px 44px; border-radius: 999px; }
.logo { bottom: 360px; right: 80px; height: 72px; }
</style></head>
<body><div class="frame">
  {{{background}}}
  <div class="shade"></div>
  <div class="top">{{{tag}}}</div>
  <div class="text">
    <div class="accent"></div>
    <h1 data-fit="560">{{{headline}}}</h1>
    {{{sub}}}
    {{{button}}}
  </div>
  <img class="logo" src="{{{logo}}}" alt="">
</div>
<script>{{{fit}}}</script>
</body></html>
