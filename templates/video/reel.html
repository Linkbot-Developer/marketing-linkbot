<!doctype html>
<html lang="en" data-resolution="portrait"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
{{{theme}}}
:root { --w: 1080px; --h: 1920px; }
#root { position: relative; width: 100%; height: 100%; }
.scene { position: absolute; inset: 0; overflow: hidden; background: var(--navy); }
/* Safe zones for Reels/TikTok UI: keep text between 250px from top and 420px from bottom. */
.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 45%; }
.shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(23,43,77,.15) 30%, rgba(23,43,77,.92) 70%, var(--navy) 100%); }
.big { position: absolute; left: 80px; right: 80px; bottom: 460px; color: var(--white); font-size: 104px; line-height: 1.04; font-weight: 800; letter-spacing: -.02em; }
.statement .big { top: 50%; bottom: auto; transform: translateY(-50%); }
.label { position: absolute; top: 250px; left: 80px; }
.steps-title { position: absolute; top: 340px; left: 80px; color: var(--white); font-size: 84px; font-weight: 800; }
.steps { position: absolute; top: 500px; left: 80px; right: 80px; display: flex; flex-direction: column; gap: 18px; }
.step { background: var(--white); color: var(--navy); font-size: 44px; font-weight: 700; padding: 32px 36px; border-radius: 24px; opacity: 0; }
.arrow { color: var(--blue-soft); font-size: 40px; text-align: center; opacity: 0; line-height: 1; }
.notif { position: absolute; left: 80px; right: 80px; bottom: 470px; background: var(--surface); color: var(--navy); font-size: 34px; line-height: 1.35;
         font-weight: 500; padding: 30px 34px; border-radius: 28px; border-left: 14px solid var(--blue); opacity: 0; }
.cta-text { position: absolute; top: 470px; left: 80px; right: 80px; text-align: center; color: var(--white); font-size: 96px; line-height: 1.05; font-weight: 800; }
.cta-btn { position: absolute; top: 1000px; left: 110px; right: 110px; text-align: center; background: var(--blue); color: var(--white); font-size: 46px; font-weight: 700; padding: 38px 30px; border-radius: 999px; }
.cta-foot { position: absolute; top: 1220px; left: 0; right: 0; text-align: center; color: #C9D6EA; font-size: 40px; font-weight: 600; }
.endlogo { position: absolute; bottom: 470px; left: 50%; height: 140px; transform: translateX(-50%); }
.cornerlogo { position: absolute; right: 60px; bottom: 470px; height: 72px; }
</style></head>
<body><div id="root" data-composition-id="main" data-start="0" data-duration="{{total}}" data-width="1080" data-height="1920">
{{{scenes}}}
</div>
<script>
 const tl = gsap.timeline({ paused: true });
{{{timeline}}}
 window.__timelines["main"] = tl;
 tl.seek(0);
</script></body></html>
